name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: APK bauen
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk Selene-Data-App.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Selene-Data-App
          path: Selene-Data-App.apk

      - name: Tag "latest" auf aktuellen Commit setzen
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Als "Neueste Version" veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Neueste Version (Build ${{ github.run_number }})
          prerelease: true
          files: Selene-Data-App.apk
          body: |
            Automatisch gebaut aus Commit ${{ github.sha }}.
            Auf dem Handy die Datei Selene-Data-App.apk herunterladen und öffnen.

